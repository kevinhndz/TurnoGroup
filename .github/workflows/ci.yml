name: Integracion continua

# Reviso las ramas de trabajo antes de llevar los cambios a main.
on:
  pull_request:
    branches: [main, 'mejora/**']
  push:
    branches: [main, 'mejora/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Uso datos ficticios para que CI nunca necesite la base real.
env:
  DATABASE_URL: sqlite://
  SECRET_KEY: ci-solamente-no-usar-en-produccion
  COOKIE_SEGURA: 'false'
  FACTURACION_MODO: simulado
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  formato:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Instalar formateador
        run: python -m pip install black==26.10.1
      - name: Revisar formato Python
        run: python -m black --check backend core database utils tests alembic scripts *.py

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TEST_REDIS_URL: redis://127.0.0.1:6379/15
    services:
      # Redis aislado para comprobar contadores compartidos y vencimiento.
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: turno_ci
          POSTGRES_PASSWORD: clave-local-ci
          POSTGRES_DB: turno_ci_pytest
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U turno_ci -d turno_ci_pytest"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Instalar dependencias
        run: python -m pip install -r requirements-dev.txt
      - name: Revisar dependencias instaladas
        run: python -m pip check
      - name: Preparar certificado TLS de prueba
        env:
          CONTENEDOR_POSTGRES_CI: ${{ job.services.postgres.id }}
        run: bash scripts/preparar_tls_ci.sh
      - name: Probar backend con SQLite
        run: python -m pytest -q --ignore=tests/test_concurrencia_postgres.py --ignore=tests/test_conexion_tls_postgres.py
      # Ejecuto tambien los bloqueos reales; SQLite no los demuestra.
      - name: Probar backend y concurrencia con PostgreSQL
        env:
          TEST_DATABASE_URL: postgresql+psycopg://turno_ci:clave-local-ci@127.0.0.1:5432/turno_ci_pytest
        run: python -m pytest -q --junitxml=/tmp/pruebas-postgres.xml
      - name: Verificar que no se omitieron pruebas PostgreSQL
        run: |
          python - <<'PY'
          from xml.etree import ElementTree
          informe = ElementTree.parse('/tmp/pruebas-postgres.xml')
          assert not informe.findall('.//skipped'), 'Hay pruebas PostgreSQL omitidas'
          PY
      # Pruebo las migraciones en otra base para no mezclar sus datos.
      - name: Crear base para migraciones
        run: |
          python - <<'PY'
          import psycopg
          with psycopg.connect('postgresql://turno_ci:clave-local-ci@127.0.0.1:5432/turno_ci_pytest', autocommit=True) as conexion:
              conexion.execute('CREATE DATABASE turno_migraciones_pytest')
              # Simulo los roles que Supabase usa para su Data API.
              for rol in ('anon', 'authenticated', 'service_role'):
                  conexion.execute(f'CREATE ROLE {rol} NOLOGIN')
          with psycopg.connect('postgresql://turno_ci:clave-local-ci@127.0.0.1:5432/turno_migraciones_pytest', autocommit=True) as conexion:
              # Simulo los permisos automaticos que debemos retirar.
              for rol in ('anon', 'authenticated', 'service_role'):
                  conexion.execute(f'ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON TABLES TO {rol}')
                  conexion.execute(f'ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON SEQUENCES TO {rol}')
          PY
      - name: Aplicar migraciones desde cero
        env:
          DATABASE_URL: postgresql+psycopg://turno_ci:clave-local-ci@127.0.0.1:5432/turno_migraciones_pytest
        run: |
          python -m alembic upgrade head
          python -m alembic current --check-heads
          python -m scripts.verificar_permisos_api

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependencias del lockfile
        run: npm ci
      - name: Revisar vulnerabilidades de dependencias
        run: npm audit --audit-level=moderate
      - name: Revisar formato del frontend
        run: npm run format:check
      - name: Probar seguridad del proxy
        run: npm run test:proxy
      - name: Compilar frontend de produccion
        run: npm run build

  seguridad:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Reviso el historial completo, no solo el ultimo archivo modificado.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      # La auditoria falla si una dependencia tiene vulnerabilidades conocidas.
      - name: Auditar dependencias Python
        run: |
          python -m pip install pip-audit==2.10.1
          python -m pip_audit -r requirements.txt --progress-spinner off
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: false
      # Instalo una version fija; Go comprueba las sumas de sus modulos.
      - name: Buscar secretos sin mostrarlos
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          "$(go env GOPATH)/bin/gitleaks" git --redact --no-banner --log-opts="--all" .

  # Conservo un resultado final para usarlo como comprobacion obligatoria.
  validar:
    if: always()
    needs: [formato, backend, frontend, seguridad]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Exigir que todos los trabajos pasen
        env:
          FORMATO: ${{ needs.formato.result }}
          BACKEND: ${{ needs.backend.result }}
          FRONTEND: ${{ needs.frontend.result }}
          SEGURIDAD: ${{ needs.seguridad.result }}
        run: |
          test "$FORMATO" = success
          test "$BACKEND" = success
          test "$FRONTEND" = success
          test "$SEGURIDAD" = success
